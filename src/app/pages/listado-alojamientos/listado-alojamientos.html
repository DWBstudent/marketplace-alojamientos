<section class="container py-4">
  <h1>Alojamientos</h1>
  <div class="row g-4">
    <div class="col-12 col-lg-3">
      <app-filtros-alojamientos [ciudades]="ciudades()" [tipos]="tipos()" [(filtro)]="filtro" />
    </div>
    <div class="col-12 col-lg-9">
      <div class="row g-4">
        @for (alojamiento of alojamientosFiltrados(); track alojamiento.id) {
          <div class="col-12 col-sm-6 col-lg-4">
            <app-alojamiento-card [alojamiento]="alojamiento" />
          </div>
        }
      </div>
    </div>
  </div>
</section>
